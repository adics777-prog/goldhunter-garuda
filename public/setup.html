<body>
<main>
  <section class="page-hero">
    <div class="wrap">
      <span class="eyebrow" data-en="🎯 Recommended setups">🎯 Setup rekomendasi</span>
      <h1 data-en="One EA, &lt;span class=&quot;gold-text&quot;&gt;a Setup per Pair&lt;/span&gt;">Satu EA, <span class="gold-text">Setup per Pair</span></h1>
      <p data-en="One GOLD HUNTER GARUDA EA for every pair. HQ prepares a recommended setup for each pair and keeps it in step with every EA version; members get the details and the preset in the member area.">Satu EA GOLD HUNTER GARUDA untuk semua pair. Pusat menyiapkan setup rekomendasi untuk tiap pair dan menyesuaikannya dengan setiap versi EA; detail dan presetnya untuk member di member area.</p>
    </div>
  </section>

  <div class="wrap">
    <div class="note" id="dl-state" style="margin-bottom:22px" data-en="Loading…">Memuat…</div>
    <div class="setups" id="setups"><div class="empty-box" style="grid-column:1/-1" data-en="Loading setups…">Memuat setup…</div></div>
  </div>

</main>

<script src="/assets/i18n.js?v=489e4256"></script>
<script src="/assets/site.js?v=9d5e3635"></script>
<script>
(() => {
  const T2 = SITE.TT;
  let D = null;
  function render() {
    const box = document.getElementById('setups'), st = document.getElementById('dl-state');
    st.removeAttribute('data-en');
    if (!D) { box.innerHTML = `<div class="empty-box" style="grid-column:1/-1">${T2('Setup belum bisa dimuat. Muat ulang halaman.', 'The setups could not be loaded. Please reload.')}</div>`; st.hidden = true; return; }
    st.innerHTML = D.can_download
      ? T2('✔ <b>Lisensi aktif.</b> Detail setiap setup dan unduhan preset ada di <a href="/member#/setup">member area › Setup Rekomendasi</a>; installer sudah memasang presetnya ke MetaTrader Anda.', '✔ <b>Active licence.</b> The details of every setup and the preset downloads are in <a href="/member#/setup">member area › Recommended setups</a>; the installer already put the presets into your MetaTrader.')
      : D.logged_in
        ? T2('Detail setup dan preset tersedia di <a href="/member#/setup">member area</a> selama Anda punya <b>lisensi EA aktif</b>. Belum punya? <a href="/harga#trial">Mulai trial 7 hari gratis</a>.', 'Setup details and presets are in the <a href="/member#/setup">member area</a> while you have an <b>active EA licence</b>. None yet? <a href="/harga#trial">Start the free 7-day trial</a>.')
        : T2('Detail setup dan preset tersedia untuk member dengan lisensi aktif: <a href="/masuk?next=/member">masuk</a> atau <a href="/daftar">daftar</a> (trial 7 hari gratis).', 'Setup details and presets are for members with an active licence: <a href="/masuk?next=/member">log in</a> or <a href="/daftar">sign up</a> (free 7-day trial).');
    box.innerHTML = D.setups.length ? D.setups.map((s) => SITE.setupCard(s, D)).join('')
      : `<div class="empty-box" style="grid-column:1/-1">${T2('Setup rekomendasi sedang disiapkan pusat.', 'HQ is preparing the recommended setups.')}</div>`;
    SITE.reveal(box);
    if (location.hash && /^#s\d+$/.test(location.hash)) { const el = document.querySelector(location.hash); if (el) { el.classList.add('show'); el.scrollIntoView({ block: 'start' }); } }
  }
  SITE.setups().then((d) => { D = d; render(); }).catch(() => { D = null; render(); });
  document.addEventListener('ghg:lang', () => { if (D) render(); });
})();
</script>
</body>
</html>
