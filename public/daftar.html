<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Gratis — GoldHunter Garuda</title>
<meta name="description" content="Daftar member GoldHunter Garuda: pantau sinyal Garuda AI untuk Emas, Bitcoin, EURUSD &amp; USDJPY dan dapatkan kabar pertama saat EA Garuda AI dibuka.">
<meta name="theme-color" content="#07070a">
<meta name="robots" content="index,follow">
<link rel="icon" href="/assets/brand/favicon.ico">
<link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/app.css?v=1c3d3e1e">
</head>
<body data-page="daftar">
<main class="auth"><div class="auth-box">
  <a class="auth-logo" href="/"><img src="/assets/brand/goldhunter-garuda-logo-256.png" width="70" height="70" alt="GoldHunter Garuda"><b class="gold-text">GOLDHUNTER GARUDA</b></a>
  <div class="card">
    <h1>Daftar Member</h1>
    <p class="sub">Gratis. Info login dikirim ke email Anda setelah pendaftaran berhasil.</p>
    <div class="alert info small" id="order-note" style="margin-bottom:16px">📡 Member bisa melihat detail sinyal Garuda AI yang masih berjalan dan mendapat kabar pertama saat EA Garuda AI dibuka.</div>
    <div id="msg" class="alert hidden" style="margin-bottom:16px"></div>
    <form novalidate>
      <div class="field"><label>Nama lengkap</label><input name="name" required autocomplete="name"></div>
      <div class="field"><label>Email</label><input name="email" type="email" required autocomplete="email" placeholder="nama@email.com"></div>
      <div class="field"><label>Nomor WhatsApp</label><input name="phone" type="tel" required autocomplete="tel" placeholder="08xxxxxxxxxx"></div>
      <div class="field"><label>Alamat</label><textarea name="address" required autocomplete="street-address" placeholder="Jalan, kota, provinsi" style="min-height:70px"></textarea></div>
      <div class="field"><label>Password (min. 8 karakter)</label><div class="pw-wrap"><input name="password" type="password" required minlength="8" autocomplete="new-password"><button type="button" data-toggle-pw>lihat</button></div></div>
      <div class="field"><label>Ulangi password</label><div class="pw-wrap"><input name="password2" type="password" required minlength="8" autocomplete="new-password"><button type="button" data-toggle-pw>lihat</button></div></div>
      <label class="row small" style="align-items:flex-start;gap:10px;margin:4px 0 18px;color:var(--muted)"><input type="checkbox" name="agree" value="1" style="margin-top:4px"> <span>Saya telah membaca dan menyetujui <a href="/#risiko" target="_blank">Peringatan Risiko</a>: trading forex/emas/kripto berisiko tinggi, bisa kehilangan seluruh modal, tidak ada jaminan profit, dan semua risiko penggunaan sinyal maupun EA menjadi tanggung jawab saya.</span></label>
      <button class="btn btn-gold btn-block" type="submit">Daftar Sekarang</button>
    </form>
  </div>
  <p class="links">Sudah punya akun? <a href="/masuk" class="keep-q">Masuk</a></p>
</div></main>
<script src="/assets/common.js?v=94a3104e"></script>
<script src="/assets/auth.js?v=f17d50e1"></script>
</body>
</html>
