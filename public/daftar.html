<body data-page="daftar">
<main class="auth"><div class="auth-box">
  <a href="#" class="auth-lang" data-lang-toggle>🌐 EN</a>
  <a class="auth-back" href="/" data-en="← Back to the home page">← Kembali ke halaman utama</a>
  <a class="auth-logo" href="/"><img src="/assets/brand/goldhunter-garuda-logo-256.png" width="70" height="70" alt="GoldHunter Garuda"><b class="gold-text">GOLDHUNTER GARUDA</b></a>
  <div class="card">
    <h1 data-en="Create an Account">Daftar Member</h1>
    <p class="sub" data-en="Free. Your login details are sent to your email after signing up.">Gratis. Info login dikirim ke email Anda setelah pendaftaran berhasil.</p>
    <div class="alert info small" id="order-note" style="margin-bottom:16px" data-en="📡 Members can see the details of running Garuda AI signals and are the first to know when the Garuda AI EA opens.">📡 Member bisa melihat detail sinyal Garuda AI yang masih berjalan dan mendapat kabar pertama saat EA Garuda AI dibuka.</div>
    <div id="msg" class="alert hidden" style="margin-bottom:16px"></div>
    <form novalidate>
      <div class="field"><label data-en="Full name">Nama lengkap</label><input name="name" required autocomplete="name"></div>
      <div class="field"><label data-en="Email">Email</label><input name="email" type="email" required autocomplete="email" placeholder="nama@email.com" data-en-placeholder="name@email.com"></div>
      <div class="field"><label data-en="WhatsApp number">Nomor WhatsApp</label><input name="phone" type="tel" required autocomplete="tel" placeholder="08xxxxxxxxxx" data-en-placeholder="+44 7xxx xxxxxx"></div>
      <div class="field"><label data-en="Address">Alamat</label><textarea name="address" required autocomplete="street-address" placeholder="Jalan, kota, provinsi" data-en-placeholder="Street, city, country" style="min-height:70px"></textarea></div>
      <div class="field"><label data-en="Password (min. 8 characters)">Password (min. 8 karakter)</label><div class="pw-wrap"><input name="password" type="password" required minlength="8" autocomplete="new-password"><button type="button" data-toggle-pw data-en="show">lihat</button></div></div>
      <div class="field"><label data-en="Repeat password">Ulangi password</label><div class="pw-wrap"><input name="password2" type="password" required minlength="8" autocomplete="new-password"><button type="button" data-toggle-pw data-en="show">lihat</button></div></div>
      <label class="row small" style="align-items:flex-start;gap:10px;margin:4px 0 18px;color:var(--muted)"><input type="checkbox" name="agree" value="1" style="margin-top:4px"> <span data-en="I have read and accept the &lt;a href=&quot;/#risiko&quot; target=&quot;_blank&quot;&gt;Risk Warning&lt;/a&gt;: trading forex / gold / crypto is high risk, I can lose all my capital, there is no guaranteed profit, and all risk of using the signals or the EA is my own responsibility.">Saya telah membaca dan menyetujui <a href="/#risiko" target="_blank">Peringatan Risiko</a>: trading forex/emas/kripto berisiko tinggi, bisa kehilangan seluruh modal, tidak ada jaminan profit, dan semua risiko penggunaan sinyal maupun EA menjadi tanggung jawab saya.</span></label>
      <button class="btn btn-gold btn-block" type="submit" data-en="Sign Up Now">Daftar Sekarang</button>
    </form>
  </div>
  <p class="links" data-en="Already have an account? &lt;a href=&quot;/masuk&quot; class=&quot;keep-q&quot;&gt;Log in&lt;/a&gt;">Sudah punya akun? <a href="/masuk" class="keep-q">Masuk</a></p>
